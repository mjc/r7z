name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.15.1
        with:
          cache: false
          rustflags: ""

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Cache p7zip-zstd oracle
        id: p7zip-oracle-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/r7z-p7zip-oracle
          key: ${{ runner.os }}-p7zip-oracle-6819e2dc1917e1267babddc6391cea56ead7123d-${{ hashFiles('scripts/ensure_p7zip_oracle.sh') }}
          restore-keys: |
            ${{ runner.os }}-p7zip-oracle-6819e2dc1917e1267babddc6391cea56ead7123d-

      - name: Install p7zip oracle dependencies
        if: steps.p7zip-oracle-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Build p7zip-zstd oracle
        run: |
          export P7ZIP_ORACLE_DIR="$HOME/.cache/r7z-p7zip-oracle"
          echo "P7ZIP_ORACLE_DIR=$P7ZIP_ORACLE_DIR" >> "$GITHUB_ENV"
          bin="$(scripts/ensure_p7zip_oracle.sh)"
          echo "P7ZIP_BIN=$bin" >> "$GITHUB_ENV"
          "$bin" i

      - name: Record archive oracle inventory
        run: |
          scripts/record_7z_oracles.sh
          cat target/oracle-inventory/README.md

      - name: Test
        run: |
          cargo test -p lzma-rust2 --lib work_
          cargo test -p lzma-rust2 --lib lz::
          cargo test --manifest-path vendor/lzma-rust2/Cargo.toml --target-dir target --no-default-features --features std,encoder --lib lz::
          cargo test --no-fail-fast -- --skip large_
          cargo test --release --test lzma_perf_test lzma_rust_vs_c_performance -- --ignored --nocapture

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1.15.1
        with:
          toolchain: 1.87.0
          cache: false
          rustflags: ""
      - name: Build workspace
        run: cargo build --workspace --all-features

  platform-build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1.15.1
        with:
          cache: false
          rustflags: ""
      - name: Build workspace
        run: cargo build --workspace --all-features

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1.15.1
        with:
          cache: false
          rustflags: ""
      - name: Check docs
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
