name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          rustflags: ""

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check fuzz targets
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
          cargo check --manifest-path fuzz/Cargo.toml --all-targets

      - name: Cache p7zip-zstd oracle
        id: p7zip-oracle-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/r7z-p7zip-oracle
          key: ${{ runner.os }}-p7zip-oracle-6819e2dc1917e1267babddc6391cea56ead7123d-${{ hashFiles('scripts/ensure_p7zip_oracle.sh') }}
          restore-keys: |
            ${{ runner.os }}-p7zip-oracle-6819e2dc1917e1267babddc6391cea56ead7123d-

      - name: Install p7zip oracle dependencies
        if: steps.p7zip-oracle-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Build p7zip-zstd oracle
        run: |
          export P7ZIP_ORACLE_DIR="$HOME/.cache/r7z-p7zip-oracle"
          echo "P7ZIP_ORACLE_DIR=$P7ZIP_ORACLE_DIR" >> "$GITHUB_ENV"
          bin="$(scripts/ensure_p7zip_oracle.sh)"
          echo "P7ZIP_BIN=$bin" >> "$GITHUB_ENV"
          "$bin" i

      - name: Record archive oracle inventory
        run: |
          scripts/record_7z_oracles.sh
          cat target/oracle-inventory/README.md

      - name: Test
        run: |
          cargo test --no-fail-fast -- --skip large_

      - name: CLI performance smoke
        run: |
          cargo build --release --bin r7z
          scripts/compare_p7zip_perf.sh --sizes 1M --runs 1 --mx 5 --r7z-threads 1 --p7zip-threads 1 --pattern random

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.99.0
          cache: false
          rustflags: ""
      - name: Build workspace
        run: cargo build --workspace --all-features

  platform-build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          rustflags: ""
      - name: Build workspace
        run: cargo build --workspace --all-features

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          rustflags: ""
      - name: Check docs
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
