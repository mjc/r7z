[package]
name = "r7z"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "LGPL-2.1-or-later"
description = "Pure-Rust library for reading and writing .7z archives"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
redundant_clone = "warn"
needless_pass_by_ref_mut = "warn"
search_is_some = "warn"
derive_partial_eq_without_eq = "warn"
needless_collect = "warn"
collection_is_never_read = "warn"
read_zero_byte_vec = "warn"
debug_assert_with_mut_call = "warn"
significant_drop_in_scrutinee = "warn"
path_buf_push_overwrite = "warn"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
arrayvec = "0.7"
smallvec = "1"
bytes = "1"
bzip2-rs = "0.1.2"
crc32fast = "1.5.0"
deflate64 = "0.1.12"
flate2 = "1"
lzma-rust2 = { git = "https://github.com/mjc/lzma-rust2", rev = "5e0b6f9d7d7eb6125655901faaf4b894d439ab80", features = ["encoder", "optimization"] }
memmap2 = "0.9"
nom = "8"
num = "0.4"
num-derive = "0.4"
num-traits = "0.2"
ppmd-rust = "1.4.0"
thiserror = "2"
aes = { version = "0.8", features = ["zeroize"] }
cbc = "0.1"
sha2 = "0.10"
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cap-std = { version = "4.0.3", default-features = false }
tempfile = "3.26.0"
zeroize = "1.8"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
hex = "0.4"
pprof = { version = "0.15", features = ["flamegraph"] }
xz2 = "0.1.7"
walkdir = "2.5.0"

[[bench]]
name = "parse_bench"
harness = false

[[bench]]
name = "comparison"
harness = false

[profile.release]
debug = true

[profile.profiling]
inherits = "release"
debug = 2
strip = false
