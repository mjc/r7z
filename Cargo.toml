[package]
name = "r7z"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
description = "Pure-Rust library for reading and writing .7z archives"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bytes = "1"
crc32fast = "1.5.0"
lzma-rs = "0.3.0"
nom = "8"
num = "0.4"
num-derive = "0.4"
num-traits = "0.2"
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
hex = "0.4"
tempfile = "3.26.0"
pprof = { version = "0.15", features = ["flamegraph"] }

[[bench]]
name = "parse_bench"
harness = false

[[bench]]
name = "comparison"
harness = false

[profile.release]
debug = true